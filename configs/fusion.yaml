# Visibility-aware evidence fusion (CLAUDE.md §7.3–7.5). Defaults; calibrate on val.

# item = alert item; det_cls = detector class used as evidence.
# SH17 "shoes" cannot tell safety shoes from normal shoes (Limitations §17).
parts:
  head:  {item: helmet, det_cls: helmet}
  torso: {item: vest,   det_cls: vest}
  feet:  {item: boots,  det_cls: shoes}

rois:                         # §7.3 — TODO: tune on C2 val
  kpt_conf_min: 0.3
  head_expand: 1.5
  head_up_ratio: 0.6          # interpretation: x (expanded head ROI height)
  torso_expand: 0.10
  feet_half_w_ratio: 0.08     # x person bbox height
  feet_up_ratio: 0.03
  feet_down_ratio: 0.05
  fb_head: [0.0, 0.20]
  fb_torso: [0.25, 0.60]
  fb_feet: [0.88, 1.0]

part_assign:
  containment_min: 0.5        # inter area / PPE box area
  p_neg: 0.05                 # p when no matching box — TODO: calibrate on val
  held_helmet_wrist_dist: 0.15  # x person height
  fallback_penalty: 0.5

visibility:
  h_ref_px: 32
  use_blur: false
  blur_beta: 100.0            # TODO(verify): tune on val
  learned: false              # ablation: v_learned (logistic regression)

evidence:
  p_clip: [0.01, 0.99]
  tau_s: 2.0
  eps: 1.0e-6
  theta_obs: 1.0              # TODO: tune
  theta_pos: 1.0              # TODO: tune
  theta_neg: -1.0             # TODO: tune
  initial_state: UNKNOWN
  method: logodds             # logodds | dempster_shafer

alert:
  T_alert_s: 3.0
  T_unk_s: 30.0
  T_cooldown_s: 60.0
