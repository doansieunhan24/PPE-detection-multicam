# Visibility-aware evidence fusion (CLAUDE.md §7.3–7.5). Defaults; calibrate on val.

# item = alert item; det_cls = detector class used as evidence.
# SH17 "shoes" cannot tell safety shoes from normal shoes (Limitations §17).
parts:
  head:  {item: helmet, det_cls: helmet}
  torso: {item: vest,   det_cls: vest}
  feet:  {item: boots,  det_cls: shoes}

rois:                         # §7.3 — tuned on SH17+CHV val (training/visibility/sweep_rois.py); re-tune on C2
  kpt_conf_min: 0.3
  head_expand: 1.8
  head_up_ratio: 1.0          # x (expanded head ROI height); helmets sit above the face keypoints
  torso_expand: 0.4
  feet_half_w_ratio: 0.12     # x person bbox height
  feet_up_ratio: 0.03
  feet_down_ratio: 0.1
  fb_head: [0.0, 0.20]
  fb_torso: [0.25, 0.60]
  fb_feet: [0.88, 1.0]

part_assign:
  containment_min: 0.2        # inter area / PPE box area (val sweep: 0.5 lost 16 pts helmet recall)
  p_neg: 0.05                 # p when no box, only if p_calibration is null
  # neutral-prior calibration of detector output (SH17 val, training/visibility/calibrate.py):
  # a box ⇒ log-LR ≈ +3, no box ⇒ log-LR ≈ −0.7…−1.2. null → raw conf / p_neg
  p_calibration: configs/p_calibration.yaml
  held_helmet_wrist_dist: 0.15  # x person height
  fallback_penalty: 0.5
  exclusive: false            # one PPE box → one person (crowds); decided on val, see experiments.md

visibility:
  h_ref_px: 32
  use_blur: false
  blur_beta: 100.0            # TODO(verify): tune on val
  learned: false              # ablation: v_learned (logistic regression)
  learned_path: configs/visibility_learned.yaml   # written by training/visibility/calibrate.py

tracking:                     # in-camera track stitching (association.mode none); experiment 2026-11-06
  stitch_gap_ms: null         # null = off; e.g. 1500: a new track near a just-lost one keeps its id
  stitch_dist_h: 0.6          # max box-centre jump, in box heights

evidence:
  p_clip: [0.01, 0.99]
  tau_s: 2.0
  dt_weighting: true          # frame-rate invariant: Omega ~ W*tau (visibility-seconds); see evidence.py
  dt_nominal_s: 0.04          # weight of a track's first observation
  dt_max_s: 0.2               # cap per-observation weight after gaps
  eps: 1.0e-6
  theta_obs: 1.0              # visibility-seconds (steady W*tau); TODO: tune
  theta_pos: 1.0              # TODO: tune
  theta_neg: -0.5             # no-box log-LR is only -0.73 (torso) … -1.18 (head); TODO: tune on C2
  theta_neg_part:             # optional per-part theta_neg (null = theta_neg); experiment 2026-11-06
    head: null
    torso: null
    feet: null
  initial_state: UNKNOWN
  method: logodds             # logodds | dempster_shafer
  ds:                         # thresholds for the Dempster–Shafer variant (score, obs in [-1,1], [0,1])
    theta_obs: 0.5
    theta_pos: 0.3
    theta_neg: -0.3

alert:
  T_alert_s: 3.0
  T_unk_s: 30.0
  T_cooldown_s: 60.0

baselines:                    # §7.6 — same detector/tracker/persistence as P (rule 6)
  pos_thr: 0.25               # p >= this ⇒ "PPE seen" (= detector conf threshold)
  primary_cam: cam1           # camera used by single-cam baselines B0/B1
