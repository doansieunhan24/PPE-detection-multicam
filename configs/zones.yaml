# Zones on the floor map (metres). Check on the image: tools/calibrate_homography.py figures --zones.
# type: forbidden | risk | ppe_required

association:
  # ground_plane: match people across cameras on the floor map (§7.2, multi-view fusion)
  # none: no cross-camera matching, each (cam, track_id) is its own person (user decision
  # 2026-10-31); fusion is then temporal within one camera, crowd counts may double-count
  mode: none
  d_max_m: 0.8
  vote_window_frames: 15
  # Tolerance around each camera's fov_floor_polygon_m when gating a pair match: people cut by
  # the image edge have their foot point just outside the polygon. WILDTRACK oracle sweep:
  # 0 → 0.5 m raises pairwise recall 0.94 → 0.97 (d_max 0.8). Retune on C2.
  fov_margin_m: 0.5
  # bbox_bottom | ankles. Ankles are above the floor → biased floor point (§7.1 change,
  # pending user confirmation). WILDTRACK median floor error 0.23 m vs 0.68 m.
  foot_point: bbox_bottom
  # Gate for a pair where one bbox is cut by the image bottom (foot point unreliable, §7.1;
  # such obs are also left out of the cluster floor position when others exist).
  # WILDTRACK: truncated floor error median 0.61 m (det) / 0.77 m (GT boxes) vs 0.23 / 0.09 m;
  # 1.2 m: oracle pair F1 0.982 → 0.985, count MAE 1.09 → 0.92. null = same as d_max_m.
  # Few cut boxes in WILDTRACK (~3 %); C2 (low cams, small room) has many more → retune there.
  d_max_truncated_m: 1.2

# PPE required when the person has no floor position (uncalibrated) or is outside all zones
default_required_ppe: [helmet, vest]

# C2 lobby seen by cam2 (configs/calibration/cam2.yaml, 2026-10-31). Floor frame from the tile
# grid: 1 tile = 0.67 m, origin = left corner of the white tile right of the bin, x towards the
# exit-door wall (x ≈ 1.34), y along it (left wall with the fire cabinet at y ≈ -1.2; door
# spans y ≈ -0.78..0.27). Edges follow tile joints so actors can see them on the floor.
# cam1 (corridor) has no homography: no zone applies there (default_required_ppe, no
# INTRUSION / CROWD). The first zone containing the floor point wins: specific zones first.
zones:
  - id: Z2
    type: forbidden            # 2 × 2 tiles in front of the exit door (T08)
    polygon_m: [[0.0, -0.67], [1.34, -0.67], [1.34, 0.67], [0.0, 0.67]]
    required_ppe: [helmet, vest, boots]
  - id: Z3
    type: risk                 # 2 × 3 tiles mid-lobby: crowd (T10), lying still (T09)
    polygon_m: [[-1.34, -0.67], [0.0, -0.67], [0.0, 1.34], [-1.34, 1.34]]
    required_ppe: [helmet, vest]
  - id: Z1
    type: ppe_required         # rest of the lobby floor
    polygon_m: [[-3.35, -1.34], [1.34, -1.34], [1.34, 3.35], [-3.35, 3.35]]
    required_ppe: [helmet, vest]
