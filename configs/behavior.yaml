# Behavior thresholds (CLAUDE.md §7.7). Rule-based defaults; TODO: tune on fall datasets / C2.

fall:
  method: rule                # rule | seq (learned 1D temporal CNN, training/fall/train_seq.py)
  kpt_conf_min: 0.3
  angle_deg: [35, 65]         # torso angle → pose score ramps 0..1 between these
  aspect_ratio: [0.8, 1.4]    # bbox w/h → pose score ramps 0..1 between these
  drop_ratio: 0.2             # hip drops >= this × standing bbox height (val MCFD + UR Fall; was 0.3) ...
  drop_window_s: 1.0          # ... within this window → "fall motion"
  drop_memory_s: 3.0          # a drop counts for this long after it happened
  no_drop_factor: 0.5         # lying pose without a recent drop (already lying, sitting down slowly)
  fusion: vmean               # vmean (§7.7, visibility-weighted mean) | max (ablation)
  h_ref_px: 96                # whole-body visibility size reference for multi-view fusion
  score_threshold: 0.6        # fused score; lying without drop (≤ 0.5) never alerts alone
  hold_s: 0.2                 # UR Fall val (odd seqs): 0.5 → 0.2 recall 0.27 → 0.60, same FA; falls end soon after lying
  seq_len: 45                 # frames (1.5 s @ 30 fps), learned variant
  seq_model: models/fall_seq.pt
  seq_threshold: 0.5          # fixed a priori (training uses the val split; no separate tuning set)

immobility:
  disp_eps_ratio: 0.01        # mean kpt displacement / bbox height per frame below this = still
  T_immobile_s: 10.0          # TODO(verify)
  lying_score_min: 0.5        # pose score that counts as lying / sitting on the floor
  recent_fall_s: 30.0         # immobile right after a fall alerts anywhere

intrusion:
  T_intr_s: 1.0

crowd:
  K: 3                        # alert when count > K (≥ 4 people, C2 take T10); zones may override with crowd_max
  T_s: 5.0
  zone_types: [risk]          # zone types where crowd is checked

cooldown_s: 60.0
